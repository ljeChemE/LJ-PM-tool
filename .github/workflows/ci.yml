name: CI

# Practices Playbook Pillar VI — CI is tiered by risk and cost.
#
# DEVIATION FROM THE KIT'S DEFAULT: the template this file started from
# triggers on `pull_request` only, assuming every change lands via a
# develop-to-main PR flow with branch protection. This is a solo project
# with no second reviewer to satisfy a required-approval rule, so branch
# protection is deliberately not enabled (see ops/bootstrap-repo.sh) and
# every commit lands directly on `main`. `push` is therefore the only event
# that actually happens here — `pull_request` is left in for the day this
# project gets a second contributor and a real PR flow starts making sense.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. A new push to the same branch makes the
# previous run's result moot before it finishes, so cancel it rather than
# let two runs race for the same status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level: every job inherits read-only unless it
# declares more. None of the jobs below need more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # FAST TIER — every push to main. Minutes-not-hours by design: lint, types,
  # drift, integration. This is the tier a contributor waits on, so it stays
  # cheap on purpose.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run --prefix frontend lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No backend type checker yet (mypy or similar) — same gap noted in
      # the justfile's typecheck recipe; add both together the day one lands.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run --prefix frontend typecheck

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    services:
      # Real engine, production major version (Playbook Pillar IV) — a
      # fresh, disposable instance per run, not the dev database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend

  # No unit-tests job yet — tests/unit/ is empty (everything so far is an
  # integration test against the real database). Add this job the day the
  # first pure-logic unit test lands; until then it would just be `pytest`
  # exiting non-zero for "collected 0 items," a false red for no reason.

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Write .env for the test suite's conftest
        run: |
          cat <<EOF > .env
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_DB=app
          POSTGRES_PORT=5432
          EOF
      - run: pytest

  # ---------------------------------------------------------------------------
  # FULL GATE — only on workflow_dispatch or a push to main. There's no
  # separate integration branch here (see the trigger comment above), so
  # "the door production walks through" is just every push to main.
  # ---------------------------------------------------------------------------

  # No e2e-tests job yet — tests/e2e/ is empty and `just e2e` is still a
  # stub. Add this job in the same change that gives it something real to
  # run; a11y checks (axe or equivalent) belong in it once there's a UI
  # worth checking.

  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t api:scan ./backend
      - name: Scan api image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "api:scan"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          # Cache disabled deliberately: Trivy's vulnerability-DB cache is
          # keyed per-ref by default, so every branch would write its own DB
          # snapshot into the shared Actions cache — that blows through the
          # repo's 10 GB cache cap fast, and LRU eviction at the cap starts
          # evicting other jobs' live caches to make room. A fresh DB pull is
          # a couple of minutes; that's cheaper than the eviction thrash.
          cache: false

      # frontend/Dockerfile builds a DEV image (runs `npm run dev`, installs
      # every devDependency — vite, npm's own tooling, all of it). Scanning
      # it flags CVEs in build-time tooling that never ships anywhere, which
      # the Playbook calls out directly: "scanning anything else answers a
      # question nobody asked." Add this back once frontend/ has a real
      # production build (a multi-stage Dockerfile serving the built static
      # files) — that artifact is the one worth scanning.

  # No version job yet — this project doesn't have a version-computing tool
  # wired up (GitVersion.yml exists but is unconnected). That's Pillar VII
  # (releases), a deliberately separate step from CI.

  ops-validate:
    name: Validate ops artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Download the pinned binary directly rather than a third-party
      # "setup-actionlint" marketplace action — one fewer supply-chain link
      # for a tool that already ships versioned, checksummed release
      # binaries of its own. Bump this pin deliberately; check
      # https://github.com/rhysd/actionlint/releases for current.
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash -s -- 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
